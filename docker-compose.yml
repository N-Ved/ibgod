# IB God — study planner for the n-ved.com home server. (No AI model: the coach and feedback writer were removed.)
#
# Runs as its own compose project so the existing `fileserver` stack is never rebuilt or restarted by it.
# The only link to that stack is the shared `fileserver_apps` network, where Caddy (after Authelia has
# verified the user) proxies ibgod.n-ved.com to `ibgod:8080`. Nothing publishes a host port.
#
#   docker compose up -d --build        start / update
#   docker compose logs -f ibgod        follow the app log
#   docker compose down                 stop (data in ./data is kept)

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ibgod:
    <<: *hardening
    build: .
    image: local/ibgod:latest
    container_name: ibgod
    user: "1000:1000"            # owner of the library files; the library itself is mounted read-only
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      TZ: Europe/Stockholm
      IBGOD_LIBRARY_ROOT: /library
      IBGOD_DATA_DIR: /data
      IBGOD_TRUSTED_PROXY_HOSTS: caddy
      IBGOD_PUBLIC_HOSTS: ibgod.n-ved.com
      IBGOD_ADMIN_GROUPS: lldap_admin
      IBGOD_ADMIN_USERS: admin
      IBGOD_EXCLUDE_TOP: "lost+found,Shaffy"   # top-level folders that are never indexed or served
      IBGOD_INDEX_WORKERS: "2"
    volumes:
      # never let Docker create an empty folder on the system disk if the data drive is missing
      - {type: bind, source: /mnt/files/docs, target: /library, read_only: true, bind: {create_host_path: false}}
      - ./data:/data
      # FileBrowser's database and config, read-only: its users, groups and access rules decide what each person sees here
      - {type: bind, source: /opt/fileserver/filebrowser-data, target: /filebrowser, read_only: true, bind: {create_host_path: false}}
    networks: [apps]
    mem_limit: 3g
    cpus: 3.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

networks:
  apps:
    external: true
    name: fileserver_apps        # existing network of the fileserver stack (internal: caddy <-> apps, no egress)
