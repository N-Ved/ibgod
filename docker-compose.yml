# IB God — study planner for IB Diploma students.
#
# This example is intended to run behind a reverse proxy and an authentication service.
# Nothing publishes a host port by default.
#
#   docker compose up -d --build        start / update
#   docker compose logs -f ibgod        follow the app log
#   docker compose down                 stop (data in ./data is kept)

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ibgod:
    <<: *hardening
    build: .
    image: local/ibgod:latest
    container_name: ibgod
    user: "1000:1000"            # owner of the library files; the library itself is mounted read-only
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      TZ: ${TZ:-UTC}
      IBGOD_LIBRARY_ROOT: /library
      IBGOD_DATA_DIR: /data
      IBGOD_TRUSTED_PROXY_HOSTS: ${IBGOD_TRUSTED_PROXY_HOSTS:-caddy}
      IBGOD_PUBLIC_HOSTS: "${IBGOD_PUBLIC_HOSTS:-}"
      IBGOD_ADMIN_GROUPS: "${IBGOD_ADMIN_GROUPS:-}"
      IBGOD_ADMIN_USERS: "${IBGOD_ADMIN_USERS:-admin}"
      IBGOD_EXCLUDE_TOP: "${IBGOD_EXCLUDE_TOP:-lost+found}"
      IBGOD_INDEX_WORKERS: "${IBGOD_INDEX_WORKERS:-2}"
      IBGOD_VIEW_BASE: "${IBGOD_VIEW_BASE:-}"
      IBGOD_DOCS_BASE: "${IBGOD_DOCS_BASE:-}"
      IBGOD_LOGOUT_URL: "${IBGOD_LOGOUT_URL:-/logout}"
    volumes:
      # never let Docker create an empty folder on the system disk if the data drive is missing
      - type: bind
        source: "${IBGOD_LIBRARY_PATH:-./library}"
        target: /library
        read_only: true
        bind:
          create_host_path: false
      - ${IBGOD_DATA_PATH:-./data}:/data
      # FileBrowser's database and config, read-only: its users, groups and access rules decide what each person sees here
      - type: bind
        source: "${IBGOD_FILEBROWSER_DATA_PATH:-./filebrowser-data}"
        target: /filebrowser
        read_only: true
        bind:
          create_host_path: false
    networks: [apps]
    mem_limit: 3g
    cpus: 3.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

networks:
  apps:
    external: ${IBGOD_EXTERNAL_NETWORK:-false}
    name: ${IBGOD_NETWORK_NAME:-ibgod}
